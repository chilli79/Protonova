<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS: EGOIST // TEMPORAL</title>
    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --surface-hover: #1a1a1a;
            --border: #333;
            --text-main: #Eaeaea;
            --text-mute: #666;
            --accent: #0A84FF; 
            --gold: #FFD60A;
            --danger: #FF375F;
            --success: #30D158;
            --font: 'SF Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            grid-template-rows: 60px 1fr;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(5,5,5,0.9);
            z-index: 10;
        }
        .logo { font-weight: 800; letter-spacing: 2px; color: var(--text-main); }
        .date-display { color: var(--text-mute); font-size: 0.9rem; }

        /* --- SIDEBAR LEFT: CONTROLS --- */
        .sidebar-left {
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            background: var(--surface);
        }

        .control-group h3 {
            font-size: 0.7rem; color: var(--text-mute); margin-bottom: 10px; letter-spacing: 1px;
        }

        .btn-ambient {
            width: 100%; padding: 10px; background: #000; border: 1px solid var(--border);
            color: var(--text-mute); text-align: left; margin-bottom: 5px; cursor: pointer;
            transition: 0.2s; font-size: 0.8rem;
        }
        .btn-ambient:hover, .btn-ambient.active { border-color: var(--accent); color: var(--accent); }

        /* CUSTOM TIMER */
        .timer-wrapper {
            background: #000; border: 1px solid var(--border); padding: 20px; text-align: center;
            border-radius: 8px;
        }
        .timer-display { font-size: 2.5rem; font-weight: 300; display: block; margin-bottom: 10px; }
        .timer-input {
            width: 60px; background: #222; border: none; color: white; padding: 5px;
            text-align: center; font-family: var(--font); margin-right: 5px;
        }
        .btn-action {
            background: var(--text-main); color: black; border: none; padding: 6px 15px;
            cursor: pointer; font-weight: bold;
        }

        /* --- CENTER: CALENDAR & TASKS --- */
        .main-stage {
            padding: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* BOSS BANNER */
        .boss-banner {
            padding: 30px; border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,214,10,0.05), transparent);
        }
        .boss-title { color: var(--gold); font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 10px; }
        .boss-input {
            width: 100%; background: transparent; border: none; color: white;
            font-size: 1.5rem; font-weight: bold; font-family: var(--font);
        }

        /* TIMELINE VIEW */
        .timeline-container { padding: 30px; }
        .timeline-item {
            display: flex; gap: 20px; margin-bottom: 20px; position: relative;
        }
        .timeline-item::before {
            content: ''; position: absolute; left: 60px; top: 0; bottom: -20px;
            width: 1px; background: var(--border); z-index: 0;
        }
        .timeline-time {
            width: 60px; font-size: 0.8rem; color: var(--text-mute); text-align: right;
            padding-top: 5px; background: var(--bg); z-index: 1;
        }
        .timeline-card {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            padding: 15px; border-radius: 6px; position: relative; cursor: pointer;
            transition: 0.2s;
        }
        .timeline-card:hover { border-color: var(--accent); transform: translateX(5px); }
        .timeline-card.done { opacity: 0.4; border-color: var(--success); text-decoration: line-through; }
        
        .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .technique-badge {
            font-size: 0.7rem; background: rgba(10, 132, 255, 0.1); color: var(--accent);
            padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(10, 132, 255, 0.3);
        }
        .card-title { font-size: 1rem; font-weight: 600; }
        .card-stats { font-size: 0.75rem; color: var(--text-mute); margin-top: 5px; }

        /* --- SIDEBAR RIGHT: STATS --- */
        .sidebar-right {
            border-left: 1px solid var(--border);
            padding: 25px;
            background: var(--surface);
            overflow-y: auto;
        }
        .stat-row { margin-bottom: 25px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        .bar-bg { width: 100%; height: 4px; background: #222; }
        .bar-fill { height: 100%; width: 0%; transition: 1s cubic-bezier(0.22, 1, 0.36, 1); }

        /* MODAL */
        #cmd-modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;
        }
        .cmd-box { width: 600px; background: #111; padding: 30px; border: 1px solid var(--border); }
        .json-input { 
            width: 100%; height: 200px; background: black; color: var(--accent); 
            border: 1px solid #333; padding: 15px; font-family: monospace; font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">OS: EGOIST // V3.0</div>
        <div class="date-display" id="full-date">LOADING...</div>
    </header>

    <div class="sidebar-left">
        <div class="control-group">
            <h3>AUDIO ENGINE</h3>
            <button class="btn-ambient" onclick="toggleAudio('rain')" id="btn-rain">/// HEAVY RAIN</button>
            <button class="btn-ambient" onclick="toggleAudio('space')" id="btn-space">/// DEEP SPACE</button>
            <button class="btn-ambient" onclick="toggleAudio('silence')" id="btn-silence">/// SILENCE</button>
        </div>

        <div class="control-group">
            <h3>MANUAL TIMER</h3>
            <div class="timer-wrapper">
                <span class="timer-display" id="timer">00:00</span>
                <div style="display:flex; justify-content:center; gap:5px;">
                    <input type="number" id="custom-min" class="timer-input" placeholder="Min" value="25">
                    <button class="btn-action" onclick="startCustomTimer()">RUN</button>
                    <button class="btn-action" style="background:#333; color:white;" onclick="resetTimer()">X</button>
                </div>
            </div>
        </div>

        <div style="margin-top:auto">
            <button class="btn-ambient" style="text-align:center; border-color: var(--gold); color: var(--gold);" onclick="openModal()">CMD + K (INJECT PLAN)</button>
        </div>
    </div>

    <div class="main-stage">
        <div class="boss-banner">
            <div class="boss-title">DAILY BOSS RAID</div>
            <input type="text" class="boss-input" id="boss-input" placeholder="AWAITING ORDERS..." onchange="saveData()">
        </div>

        <div class="timeline-container" id="timeline">
            <div style="text-align:center; color: #444; margin-top: 50px;">NO MISSION DATA.<br>PRESS CMD+K TO INJECT SCHEDULE.</div>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="stat-row">
            <div class="stat-label"><span>PLAYER RANK</span><span style="color:var(--gold)" id="rank-txt">NOVICE</span></div>
            <div class="stat-label" style="font-size:0.7rem; color:#666;">XP PROGRESS</div>
            <div class="bar-bg"><div class="bar-fill" style="background:var(--gold)" id="xp-bar"></div></div>
        </div>

        <div class="stat-row">
            <div class="stat-label"><span>INTELLECT (GATE)</span><span id="stat-int">0</span></div>
            <div class="bar-bg"><div class="bar-fill" style="background:var(--accent)" id="bar-int"></div></div>
        </div>

        <div class="stat-row">
            <div class="stat-label"><span>ARTISTRY (DANCE)</span><span id="stat-art">0</span></div>
            <div class="bar-bg"><div class="bar-fill" style="background:var(--danger)" id="bar-art"></div></div>
        </div>

        <div class="stat-row">
            <div class="stat-label"><span>WILL (DISCIPLINE)</span><span id="stat-will">0</span></div>
            <div class="bar-bg"><div class="bar-fill" style="background:var(--success)" id="bar-will"></div></div>
        </div>
    </div>

    <div id="cmd-modal">
        <div class="cmd-box">
            <h3 style="margin-top:0">TEMPORAL INJECTION</h3>
            <p style="color:#666; font-size:0.8rem;">Paste Gemini JSON output here:</p>
            <textarea id="json-inject" class="json-input"></textarea>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn-action" onclick="injectSchedule()">INITIALIZE SCHEDULE</button>
                <button class="btn-action" style="background:#333; color:white;" onclick="closeModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CORE STATE MANAGEMENT ---
        const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        document.getElementById('full-date').innerText = today;

        let state = JSON.parse(localStorage.getItem('ego_v3_state')) || {
            xp: 0,
            level: 1,
            stats: { int: 0, art: 0, will: 0 },
            boss: "",
            schedule: []
        };

        function save() {
            localStorage.setItem('ego_v3_state', JSON.stringify(state));
            render();
        }

        function render() {
            // Stats
            document.getElementById('rank-txt').innerText = `LVL ${state.level}`;
            document.getElementById('xp-bar').style.width = `${(state.xp % 500) / 5}%`;
            
            ['int', 'art', 'will'].forEach(s => {
                document.getElementById(`stat-${s}`).innerText = state.stats[s];
                document.getElementById(`bar-${s}`).style.width = `${Math.min(state.stats[s], 100)}%`;
            });

            // Boss
            document.getElementById('boss-input').value = state.boss;

            // Timeline Schedule
            const timeline = document.getElementById('timeline');
            if(state.schedule.length > 0) timeline.innerHTML = '';
            
            state.schedule.forEach((block, index) => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                
                // Color coding
                let color = 'var(--text-mute)';
                if(block.type === 'int') color = 'var(--accent)';
                if(block.type === 'art') color = 'var(--danger)';
                if(block.type === 'will') color = 'var(--success)';

                item.innerHTML = `
                    <div class="timeline-time">${block.time}</div>
                    <div class="timeline-card ${block.done ? 'done' : ''}" onclick="toggleBlock(${index})">
                        <div class="card-header">
                            <span class="technique-badge" style="color:${color}; border-color:${color}">${block.technique}</span>
                            <span style="font-size:0.7rem; color:#666;">XP: ${block.xp}</span>
                        </div>
                        <div class="card-title">${block.task}</div>
                        <div class="card-stats">TYPE: ${block.type.toUpperCase()}</div>
                    </div>
                `;
                timeline.appendChild(item);
            });
        }

        // --- 2. LOGIC & ACTIONS ---
        function toggleBlock(index) {
            const block = state.schedule[index];
            if(!block.done) {
                // Complete
                block.done = true;
                state.xp += block.xp;
                state.stats[block.type] += (block.xp / 5);
                
                // Check level up
                if(state.xp > state.level * 500) {
                    state.level++;
                    alert("LEVEL UP. EGO EXPANDED.");
                }
            } else {
                // Undo
                block.done = false;
                state.xp -= block.xp;
                state.stats[block.type] -= (block.xp / 5);
            }
            save();
        }

        function saveData() {
            state.boss = document.getElementById('boss-input').value;
            save();
        }

        // --- 3. JSON INJECTION ---
        function openModal() { document.getElementById('cmd-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('cmd-modal').style.display = 'none'; }
        
        // Keyboard Shortcut
        document.addEventListener('keydown', (e) => {
            if((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault(); openModal();
            }
        });

        function injectSchedule() {
            try {
                const raw = document.getElementById('json-inject').value;
                const data = JSON.parse(raw);
                
                // Reset schedule
                state.boss = data.boss_goal;
                state.schedule = data.timeline.map(item => ({
                    time: item.time,
                    task: item.task,
                    technique: item.technique, // e.g., "50/10 Pomodoro"
                    type: item.type, // "int", "art", "will"
                    xp: item.xp,
                    done: false
                }));
                
                save();
                closeModal();
            } catch(e) {
                alert("DATA CORRUPT. CHECK JSON FORMAT.");
            }
        }

        // --- 4. AUDIO ENGINE ---
        let audioCtx, osc;
        function toggleAudio(type) {
            if(osc) { osc.stop(); osc = null; }
            document.querySelectorAll('.btn-ambient').forEach(b => b.classList.remove('active'));
            if(type === 'silence') return;
            
            document.getElementById(`btn-${type}`).classList.add('active');
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 4096;
            const node = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            
            node.onaudioprocess = (e) => {
                const out = e.outputBuffer.getChannelData(0);
                for(let i=0; i<bufferSize; i++) {
                    const r = Math.random() * 2 - 1;
                    out[i] = type === 'space' ? r * 0.05 : r * 0.1; // Brown vs Pink
                }
            };
            node.connect(audioCtx.destination);
            osc = { stop: () => { node.disconnect(); audioCtx.close(); }};
        }

        // --- 5. OMNI-TIMER ---
        let timerInt;
        function startCustomTimer() {
            clearInterval(timerInt);
            const min = parseInt(document.getElementById('custom-min').value) || 25;
            let seconds = min * 60;
            
            timerInt = setInterval(() => {
                const m = Math.floor(seconds/60).toString().padStart(2,'0');
                const s = (seconds%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                document.title = `${m}:${s} // FOCUS`;
                
                if(seconds > 0) seconds--;
                else { clearInterval(timerInt); alert("SESSION COMPLETE"); }
            }, 1000);
        }
        function resetTimer() {
            clearInterval(timerInt);
            document.getElementById('timer').innerText = "00:00";
            document.title = "OS: EGOIST";
        }

        render();
    </script>
</body>
</html>
